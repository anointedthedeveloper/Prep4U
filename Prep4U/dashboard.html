<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Prep4U</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="assets/logo.png" alt="Prep4U Logo" class="logo">
                <span>Prep4U</span>
            </div>
            <div class="nav-menu" id="navMenu">
                <a href="dashboard.html" class="nav-link active">Dashboard</a>
                <a href="take-exam.html" class="nav-link">Exams</a>
                <a href="results.html" class="nav-link">Results</a>
                <a href="#" class="nav-link" id="logoutBtn">Logout</a>
            </div>
            <div class="hamburger" id="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <h1>Student Dashboard</h1>
            <p>Welcome back, <span id="userName">Student</span>!</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Active Exams</h3>
                <p class="stat-number" id="activeExams">0</p>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <p class="stat-number" id="completedExams">0</p>
            </div>
            <div class="stat-card">
                <h3>Average Score</h3>
                <p class="stat-number" id="averageScore">-</p>
            </div>
        </div>

        <div class="dashboard-section">
            <h2>Available Exams</h2>
            <div class="exam-list" id="examList">
                <!-- Exams will be loaded dynamically from Firebase -->
                <div class="loading">Loading exams...</div>
            </div>
        </div>

        <div class="dashboard-section">
            <h2>Recent Results</h2>
            <div class="results-list" id="recentResults">
                <!-- Recent results will be loaded dynamically -->
                <div class="loading">Loading results...</div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/firebase.js"></script>
    <script src="firebase/firebase-config.js"></script>
</body>
</html>
