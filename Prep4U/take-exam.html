<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Exam - Prep4U</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="assets/logo.png" alt="Prep4U Logo" class="logo">
                <span>Prep4U</span>
            </div>
            <div class="exam-timer" id="examTimer">
                Time Left: <span id="timeDisplay">60:00</span>
            </div>
            <div class="hamburger" id="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="exam-header">
            <h1 id="examTitle">Exam Title</h1>
            <div class="exam-info">
                <span>Total Questions: <span id="totalQuestions">0</span></span>
                <span>Total Points: <span id="totalPoints">0</span></span>
            </div>
        </div>

        <div class="exam-container">
            <div class="question-navigation" id="questionNav">
                <!-- Question numbers will be generated here -->
            </div>

            <div class="question-container">
                <form id="examForm">
                    <div class="question-card" id="questionCard">
                        <!-- Questions will be loaded dynamically -->
                        <div class="loading">Loading exam questions...</div>
                    </div>
                    
                    <div class="exam-actions">
                        <button type="button" class="btn btn-secondary" id="prevQuestion">Previous</button>
                        <button type="button" class="btn btn-primary" id="nextQuestion">Next</button>
                        <button type="submit" class="btn btn-success" id="submitExam">Submit Exam</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/firebase.js"></script>
    <script src="firebase/firebase-config.js"></script>
</body>
</html>
